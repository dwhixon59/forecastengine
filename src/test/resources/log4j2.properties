# Test-scoped logging configuration.
#
# Without this file the test run falls through to src/main/resources/log4j2.properties, whose
# RollingFile appender writes into the production logs/app.log.  That is how a JUnit run came to
# leave RegisterControllerOtherSideTest's "database unavailable" stack trace and a burst of
# DatabaseConnectionManager connect/close/reconnect lines in a log that is supposed to hold only
# real imports.  src/test/resources precedes src/main/resources on the test classpath, so Log4j2
# picks this file up during tests and the production log stays untouched.
#
# Tests log to the console only, at INFO, so the expected-failure DEBUG diagnostics (e.g. the
# transfer-lookup stack trace that RegisterControllerOtherSideTest deliberately provokes) are not
# emitted at all.  Raise a specific logger here if a test needs its DEBUG output while debugging.
rootLogger.level = info
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = Console

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

