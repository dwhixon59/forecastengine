# Help text for budget item fields
# This properties file contains user-facing help messages that explain each field
# when creating or editing budget items.

# Category field
budgetitem.category=The category helps classify the budget item (e.g., Housing, Food, Transportation, Entertainment). \
This is used for reporting and tracking expenses by type. Categories should be consistent to allow for meaningful analysis.

# Payee field
budgetitem.payee=The payee is the person or organization that receives the payment (e.g., "Electric Company", "Grocery Store", "John Smith"). \
This helps identify where money is going and can be used for transaction matching and reporting.

# Memo field
budgetitem.memo=An optional memo field for additional notes about this budget item. \
You can include details like account numbers, reference information, or any other relevant notes. \
This field can be left blank if no additional information is needed.

# Amount field
budgetitem.amount=The amount of money for this budget item. Enter positive values for expenses and negative values for income. \
For periodic items, this is the amount per period (e.g., monthly payment amount). \
Use decimal format like 123.45 for dollars and cents.

# Running Balance field
budgetitem.runningbalance=The current balance for this budget item if it maintains a balance (like a savings goal or debt payoff). \
This tracks how much has been accumulated or paid down over time. Enter 0 if this item doesn't maintain a running balance.

# Minimum Balance field
budgetitem.minimumbalance=The minimum balance that should be maintained for this budget item. \
This is useful for savings goals or accounts where you want to keep a certain amount available. \
Enter 0 if there's no minimum balance requirement.

# Start Date field
budgetitem.startdate=The date when this budget item becomes active in the format yyyy-MM-dd (e.g., 2025-01-15). \
This determines when the item starts appearing in forecasts and budgets. \
Use today's date or a future date when the item should begin.

# Number of Payments field
budgetitem.numberofpayments=The total number of payments for this budget item. Enter 0 for ongoing items with no end date. \
For fixed-term items (like a 36-month car loan), enter the total number of payments. \
This works with the start date and period to calculate the end date automatically.

# End Date field
budgetitem.enddate=The date when this budget item stops in the format yyyy-MM-dd (e.g., 2027-12-31). \
Leave blank for ongoing items. If you specify both number of payments and end date, \
the system will use whichever comes first. This is useful for items with a known end date.

# Period Type field
budgetitem.periodtype=How often this budget item occurs: Daily, Weekly, Monthly, Quarterly, Annually, or On-Demand.

# Item Type field
budgetitem.itemtype=The type of budget item: Income, Expense, Transfer, etc. \
This helps categorize the nature of the transaction.

# How Important field
budgetitem.howimportant=The priority level of this budget item: Critical, High, Medium, or Low. \
This helps you prioritize spending when funds are limited.

# How Occurs field
budgetitem.howoccurs=How this budget item happens: Automatic (auto-pay), Manual (you initiate), or Variable.

# How Paid field
budgetitem.howpaid=The payment method: Credit Card, Debit Card, Cash, Check, Electronic Transfer, etc.

# Budget selection
budgetitem.budgetselection=Select which budget this item belongs to. If you only have one budget, \
it will be selected automatically.

# PeriodType enum help entries
periodtype.on_demand=This item occurs only when needed, not on a regular schedule. Use this for one-time \
expenses or irregular transactions that you initiate manually.

periodtype.daily=This item occurs every day. Use this for daily expenses like coffee, parking, or \
subscription services that charge daily.

periodtype.weekly=This item occurs once per week. Use this for weekly expenses like groceries, \
gym memberships, or other services that bill weekly.

periodtype.biweekly=This item occurs every two weeks (every 14 days). Commonly used for paychecks \
or bills that are due every other week.

periodtype.three_weeks=This item occurs every three weeks (every 21 days). This is a less common \
billing cycle but may be used for certain subscriptions or payment schedules.

periodtype.four_weeks=This item occurs every four weeks (every 28 days). Similar to monthly but \
based on a 4-week cycle instead of calendar months.

periodtype.semimonthly=This item occurs twice per month, typically on specific dates like the 1st and 15th. \
Common for paychecks and some bill payments.

periodtype.school_year_semimonthly=This item occurs twice per month but only during the school year. \
Use this for education-related expenses that pause during summer break.

periodtype.monthly=This item occurs once per month on the same day. The most common billing cycle \
for expenses like rent, utilities, subscriptions, and loan payments.

periodtype.six_weeks=This item occurs every six weeks (every 42 days). Use this for services or \
expenses that follow this schedule.

periodtype.bimonthly=This item occurs every two months. Use this for expenses that are billed or \
occur six times per year.

periodtype.quarterly=This item occurs every three months (four times per year). Common for \
quarterly taxes, insurance premiums, or subscription services billed quarterly.

periodtype.four_months=This item occurs every four months (three times per year). Less common but \
used for certain payment schedules or subscriptions.

periodtype.semiannually=This item occurs twice per year, typically every six months. Common for \
insurance premiums, property taxes, or semi-annual membership fees.

periodtype.annually=This item occurs once per year. Use this for annual subscriptions, yearly \
memberships, property taxes, or other expenses that recur yearly.

# ItemType enum help entries
itemtype.celebration=Special occasion expenses such as birthdays, anniversaries, holidays, or other \
celebrations. These are typically planned but non-recurring expenses.

itemtype.credit_card=Credit card payment items. Use this for tracking when you pay your credit card bill. \
This helps you manage debt and payment schedules.

itemtype.expense=General expenses that don't fit into other specific categories. This is a catch-all \
for regular spending that isn't categorized elsewhere.

itemtype.fees=Service fees, bank fees, late fees, or other charges that aren't part of your regular \
expenses. These are often avoidable costs.

itemtype.gift=Money spent on gifts for others, including birthday presents, holiday gifts, or charitable \
donations. Helps you track your generosity budget.

itemtype.income=Money coming in, such as salary, wages, bonuses, or other sources of income. \
Use this to track all money you receive.

itemtype.installment_loan=Fixed-term loan payments with a set number of payments, such as car loans, \
student loans, or personal loans. The loan will be paid off after the specified number of payments.

itemtype.insurance=Insurance premium payments including auto, home, health, life, or other insurance policies. \
These are typically essential fixed expenses.

itemtype.investments=Money allocated to investments, retirement accounts, stocks, bonds, or savings \
accounts. This represents money being set aside for future growth.

itemtype.maintenance=Home or vehicle maintenance expenses. These can be regular (oil changes) or \
irregular (repairs). Important for keeping assets in good condition.

itemtype.major_expense=Large, infrequent purchases such as appliances, furniture, or major home improvements. \
These require significant planning and budgeting.

itemtype.medical=Healthcare-related expenses including doctor visits, prescriptions, dental care, \
or medical insurance copays. Essential but sometimes unpredictable.

itemtype.rent=Monthly rent or mortgage payments. This is typically one of the largest and most \
important fixed expenses in a budget.

itemtype.revolving_credit=Credit lines that don't have a fixed payoff date, such as credit cards or \
home equity lines of credit. The balance and payment can vary.

itemtype.savings=Money being set aside for savings goals, emergency funds, or future expenses. \
Important for financial security and planning.

itemtype.subscriptions=Recurring subscription services such as streaming services, magazines, software, \
gym memberships, or other ongoing service payments.

# HowImportant enum help entries
howimportant.discretionary_nonessential=Complete control at the time of transaction and not essential. \
Examples: entertainment, vacation, dining out at fancy restaurants. You have full choice whether to spend \
and how much. This is the first area to cut if funds are tight.

howimportant.discretionary_essential=Discretionary but essential. Example: groceries. You must buy food, \
but you control how much you spend by choosing between basic and premium options (hamburger vs. lobster). \
You can adjust spending here when needed.

howimportant.fixed_nonessential=No control over the amount once committed, but not essential. \
Examples: HBO subscription, gym membership. The monthly cost is fixed, but you could cancel the service \
entirely if needed. Consider these when reviewing your budget.

howimportant.fixed_essential=Essential and you can't entirely avoid it, but you can change providers or plans. \
Examples: internet service, mortgage, cell phone plan. You need the service but have some flexibility \
in choosing between options or providers.

howimportant.variable_nonessential=No control over the amount and not essential. Similar to fixed nonessential \
but the amount can vary. Example: a streaming service with variable pricing. Can be eliminated if needed.

howimportant.variable_essential=Essential and varies month to month with no control over variation factors. \
Examples: electric bill (varies with weather), water bill. You need the service and can't control external \
factors that affect the cost, though you may have some control over usage.

# HowOccurs enum help entries
howoccurs.collection=Occurs multiple times per budget period. Example: groceries (you shop multiple times \
per month). The budget covers all occurrences within the period, and you need to track multiple transactions \
against this one budget item.

howoccurs.envelope=Occurs less than once per budget period. Example: car maintenance, vacation savings, \
annual insurance premiums. You set aside money each period for an expense that occurs less frequently. \
This is the "envelope method" of budgeting.

howoccurs.periodic=Occurs once per budget period on or about a specific day or date. Example: rent, \
monthly subscription. This is the most common pattern - one transaction per period at a predictable time.

howoccurs.unplanned=No regular budget period - happens randomly and is not in the forecast. \
Examples: emergency repairs, unexpected medical expenses. These items are tracked but not predicted \
in your regular budget forecast.

howoccurs.variable_periodic=Same as periodic (once per period) but the amount varies each period. \
Examples: electric bill, water bill, gas bill. You know when it's due but not exactly how much it will be. \
The budget amount is an estimate.

# HowPaid enum help entries
howpaid.automatic_debit=Automatically debited from your account by the payee on a schedule. Example: utility \
bills that auto-pay from your checking account. You don't initiate the payment - it happens automatically.

howpaid.automatic_transfer=Automatically transferred between your own accounts on a schedule. Example: automatic \
transfer from checking to savings. You set it up once and it happens automatically.

howpaid.bill_pay=Paid through your bank's bill pay service. You schedule the payment through your bank, and they \
send the money to the payee. Gives you control over timing while being more convenient than writing checks.

howpaid.cash=Paid with physical cash. Good for small purchases, budgeting control (envelope method), or when \
cards aren't accepted. Harder to track but gives immediate spending awareness.

howpaid.check=Paid by writing a paper check. Less common now but still used for some payments like rent, \
contractors, or when electronic payment isn't available.

howpaid.credit_card=Paid using a credit card. Convenient and may earn rewards, but requires discipline to \
pay off monthly. Be careful not to overspend since payment is delayed.

howpaid.debit_card=Paid using a debit card that directly withdraws from your checking account. Similar convenience \
to credit cards but uses your actual money immediately. Less risk of overspending.

howpaid.direct_deposit=Income received directly into your account. Examples: paycheck, tax refund, Social Security. \
This is automatic and typically the most convenient way to receive money.

howpaid.online_payment=Manual payment made through a website or app. Examples: paying a credit card bill online, \
making an Amazon purchase. You initiate each payment individually online.

howpaid.recurring_payment=Recurring payment set up with the merchant or service provider. Example: Netflix subscription \
charged monthly to your card. Similar to automatic debit but managed by the merchant, not your bank.

howpaid.transfer=Manual transfer between accounts, whether your own accounts or to another person. Examples: Venmo, \
Zelle, bank wire, or moving money between your checking and savings. You initiate each transfer.
