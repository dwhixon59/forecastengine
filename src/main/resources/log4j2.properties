# Root logger configuration
rootLogger.level = info
rootLogger.appenderRefs = file
rootLogger.appenderRef.file.ref = File

# Console appender configuration
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# File appender configuration.
#
# RollingFile rather than File:  the debug loggers below are verbose -- the matcher writes a scored
# candidate list for every imported transaction -- and with a plain File appender the log grew to
# 12 MB with nothing to stop it.  The appender is still named "File" because six loggers below
# reference it by that name.
#
# Rolls when the file reaches 10 MB or the day changes, whichever comes first, so a single busy
# import cannot bury a quiet day's history and a quiet week does not hold one stale file open.
# Archives are gzipped by virtue of the .gz suffix on the pattern.
appender.file.type = RollingFile
appender.file.name = File
appender.file.fileName = logs/app.log
appender.file.filePattern = logs/app-%d{yyyy-MM-dd}-%i.log.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c:%L - %m%n
appender.file.append = true

appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.time.modulate = true
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB

# max bounds the %i counter within one day;  the Delete action is what bounds the total, since
# without it a rollover every day would keep every day forever.  Fourteen archives is a fortnight
# of imports, which is as far back as a question about an import has ever needed to reach.
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 20
appender.file.strategy.action.type = Delete
appender.file.strategy.action.basepath = logs
appender.file.strategy.action.maxdepth = 1
appender.file.strategy.action.condition.type = IfFileName
appender.file.strategy.action.condition.glob = app-*.log.gz
appender.file.strategy.action.condition.nested_condition.type = IfAccumulatedFileCount
appender.file.strategy.action.condition.nested_condition.exceeds = 14

