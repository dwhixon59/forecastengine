# Root logger configuration
rootLogger.level = info
rootLogger.appenderRefs = file
rootLogger.appenderRef.file.ref = File

# Console appender configuration
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# File appender configuration
appender.file.type = File
appender.file.name = File
appender.file.fileName = logs/app.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c:%L - %m%n
appender.file.append = true

# Debug level for TransactionUtilities to show provisional matching debug output
logger.transactionUtilities.name = com.hixon.financialApp.model.register.TransactionUtilities
logger.transactionUtilities.level = debug
logger.transactionUtilities.additivity = false
logger.transactionUtilities.appenderRefs = file
logger.transactionUtilities.appenderRef.file.ref = File

# Debug level for WellsFargoBank to show parseMerchantPayee debug output
logger.wellsFargoBank.name = com.hixon.financialApp.model.financialinstitution.WellsFargoBank
logger.wellsFargoBank.level = debug
logger.wellsFargoBank.additivity = false
logger.wellsFargoBank.appenderRefs = file
logger.wellsFargoBank.appenderRef.file.ref = File

# Debug level for RegisterController to show resolveUnmatchedAccount debug output
logger.registerController.name = com.hixon.financialApp.controller.RegisterController
logger.registerController.level = debug
logger.registerController.additivity = false
logger.registerController.appenderRefs = file
logger.registerController.appenderRef.file.ref = File



# Debug level for Register to keep the import-file search diagnostics out of the user's console
logger.register.name = com.hixon.financialApp.model.register.Register
logger.register.level = debug
logger.register.additivity = false
logger.register.appenderRefs = file
logger.register.appenderRef.file.ref = File

# Debug level for ForecastTransactionMatcher to record the candidate scoring behind each match
